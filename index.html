<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ead5">
  <title>Tactic Fight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <button class="brand" id="home-button" type="button" aria-label="Back to the start screen">
        <span class="brand-mark" aria-hidden="true">TF</span>
        <span>TACTIC<span class="brand-accent">FIGHT</span></span>
      </button>
      <div class="round-readout" aria-live="polite">
        <span class="readout-label" id="mode-label">ROUND</span>
        <strong id="round-number">01</strong>
      </div>
      <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Mute sound" aria-pressed="true" title="Mute sound (M)">
        <svg class="speaker-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="speaker-shape" d="M4 9v6h4l5 4V5L8 9H4Z"></path>
          <path class="sound-waves" d="M16 9a5 5 0 0 1 0 6M18.5 6.5a8.5 8.5 0 0 1 0 11"></path>
          <path class="mute-slash" d="m15 9 6 6m0-6-6 6"></path>
        </svg>
      </button>
    </header>

    <section class="matchup" aria-label="Fighter status">
      <div class="fighter-status player-status">
        <div class="fighter-heading">
          <h1 id="player-name">ROOK</h1>
          <span id="player-hp-text" class="hp-number">100</span>
        </div>
        <div class="health-track" role="meter" aria-label="Player health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <div id="player-health" class="health-fill"></div>
        </div>
        <div class="fighter-meta"><span id="player-tags" class="boost-tag"></span></div>
      </div>

      <div class="fighter-status bot-status">
        <div class="fighter-heading">
          <h1 id="bot-name">BYTE</h1>
          <span id="bot-hp-text" class="hp-number">100</span>
        </div>
        <div class="health-track" role="meter" aria-label="CPU health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <div id="bot-health" class="health-fill"></div>
        </div>
        <div class="fighter-meta"><span id="bot-tags" class="boost-tag"></span></div>
      </div>
    </section>

    <section class="arena-wrap" aria-label="Fight arena">
      <canvas id="arena" width="960" height="420" role="img" aria-label="Two fighters face off in a pixel art arena"></canvas>
    </section>

    <section class="fight-console" aria-label="Combat controls">
      <div class="action-row" id="action-row"></div>
    </section>
  </main>

  <div class="move-tooltip" id="move-tooltip" role="tooltip" hidden>
    <strong id="tooltip-name"></strong>
    <span id="tooltip-detail"></span>
    <p id="tooltip-info"></p>
  </div>

  <div class="screen-announcement" id="screen-announcement" aria-live="assertive" aria-atomic="true" hidden>
    <p id="announcement-text"></p>
  </div>

  <section class="result-panel" id="result-panel" aria-labelledby="result-title" hidden>
    <div class="result-box">
      <p class="panel-kicker" id="result-kicker"></p>
      <h2 id="result-title"></h2>
      <p class="result-detail" id="result-detail"></p>
      <div class="result-actions" id="result-actions"></div>
    </div>
  </section>

  <section class="dialogue" id="dialogue" aria-labelledby="dialogue-speaker" hidden>
    <canvas class="dialogue-portrait left" id="dialogue-left" width="210" height="234" aria-hidden="true"></canvas>
    <canvas class="dialogue-portrait right" id="dialogue-right" width="210" height="234" aria-hidden="true"></canvas>
    <div class="dialogue-box">
      <p class="dialogue-speaker" id="dialogue-speaker"></p>
      <p class="dialogue-text" id="dialogue-text" aria-live="polite"></p>
      <div class="dialogue-controls">
        <button class="text-button" id="dialogue-skip" type="button">SKIP</button>
        <button class="text-button primary" id="dialogue-next" type="button">NEXT &gt;</button>
      </div>
    </div>
  </section>

  <section class="title-screen" id="title-screen" aria-labelledby="title-heading">
    <div class="title-panel">
      <p class="panel-kicker">16-BIT TURN-BASED ARCADE FIGHTER</p>
      <h2 class="game-logo" id="title-heading">TACTIC<span>FIGHT</span></h2>
      <div class="mode-list">
        <button class="mode-button" type="button" data-mode="campaign"><strong>Campaign</strong><span>Each fighter's story. Beat all six rivals on their home turf.</span></button>
        <button class="mode-button" type="button" data-mode="endless"><strong>Endless</strong><span>New opponent every fight, full health each time. How long can you last?</span><em id="endless-best"></em></button>
        <button class="mode-button" type="button" data-mode="quick"><strong>Quick Fight</strong><span>Pick a fighter and take on a random opponent.</span></button>
      </div>
      <p class="title-hint">Click or press 1-3. Press M to mute.</p>
    </div>
  </section>

  <section class="character-select" id="character-select" aria-labelledby="select-title" hidden>
    <div class="select-panel">
      <p class="panel-kicker" id="select-mode"></p>
      <h2 id="select-title">Choose your fighter</h2>
      <div class="select-grid" id="select-grid"></div>
      <button class="text-button" id="select-back" type="button">&lt; BACK</button>
    </div>
  </section>

  <section class="fighter-detail" id="fighter-detail" aria-labelledby="detail-name" hidden>
    <div class="detail-box">
      <canvas class="detail-portrait" id="detail-portrait" width="210" height="234" aria-hidden="true"></canvas>
      <div class="detail-info">
        <p class="panel-kicker" id="detail-title"></p>
        <h2 id="detail-name"></h2>
        <p class="detail-hp" id="detail-hp"></p>
        <p class="detail-story" id="detail-story"></p>
        <div class="detail-moves" id="detail-moves"></div>
        <p class="detail-progress" id="detail-progress"></p>
        <div class="detail-actions">
          <button class="text-button" id="detail-back" type="button">&lt; BACK</button>
          <button class="big-button" id="detail-fight" type="button">FIGHT!</button>
        </div>
      </div>
    </div>
  </section>

  <script src="sound.js"></script>
  <script src="music.js"></script>
  <script src="characters.js"></script>
  <script src="story.js"></script>
  <script src="icons.js"></script>
  <script src="stages.js"></script>
  <script src="graphics.js"></script>
  <script src="game.js"></script>
</body>
</html>
